[workspace]
resolver = "2"
members = ["crates/archpkg", "apps/gui", "apps/tray"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Go Kobayashi <kobago55555@gmail.com>"]
repository = "https://github.com/kobago/fuide-arch-update"

[workspace.dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
fuide = { git = "ssh://git@github.com/kobago/fuide.git", branch = "main" }
archpkg = { path = "crates/archpkg" }
chrono = "0.4"
serde_json = "1"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"

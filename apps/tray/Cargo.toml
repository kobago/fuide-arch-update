[package]
name = "fuide-arch-update-tray"
description = "Systray applet for FUIDE Arch-Update: checks for pacman / AUR updates and notifies"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fuide-arch-update-tray"
path = "src/main.rs"

[dependencies]
archpkg = { workspace = true }
ksni = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
notify-rust = "4"
notify = "8"
log = { workspace = true }
env_logger = "0.11"
